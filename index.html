<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dompet Ku - Multi Bank & Auto Migrasi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <header class="bg-indigo-600 text-white p-6 shadow-lg rounded-b-3xl max-w-md mx-auto">
    <div class="flex justify-between items-center mb-4">
      <div>
        <p class="text-xs text-indigo-200 uppercase tracking-wider font-semibold">Total Saldo Utama (Semua Bank)</p>
        <h1 id="total-saldo" class="text-3xl font-extrabold mt-1">Rp 0</h1>
      </div>
      <div class="flex flex-wrap gap-1.5 justify-end max-w-[160px]">
        <button onclick="toggleModalBank()" class="text-[11px] bg-indigo-500 hover:bg-indigo-400 text-white px-2.5 py-1.5 rounded-xl font-medium">🏦 Bank</button>
        <button onclick="toggleModalWallet()" class="text-[11px] bg-indigo-500 hover:bg-indigo-400 text-white px-2.5 py-1.5 rounded-xl font-medium">👛 Dompet</button>
        <button onclick="exportData()" title="Backup" class="text-[11px] bg-indigo-700 hover:bg-indigo-800 text-white px-2 py-1.5 rounded-xl font-medium">📤</button>
        <button onclick="document.getElementById('import-input').click()" title="Restore" class="text-[11px] bg-indigo-700 hover:bg-indigo-800 text-white px-2 py-1.5 rounded-xl font-medium">📥</button>
        <input type="file" id="import-input" accept=".json" class="hidden" onchange="importData(event)">
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-6 space-y-6">
    <div id="warning-container" class="space-y-2"></div>

    <section>
      <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3">Daftar Akun Bank (Sumber Uang)</h2>
      <div id="bank-summary-list" class="grid grid-cols-2 gap-3"></div>
    </section>

    <section>
      <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3">Alokasi Dompet (Kategori)</h2>
      <div id="wallet-list" class="grid grid-cols-1 gap-3"></div>
    </section>

    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
      <h2 class="text-base font-bold text-slate-700 mb-4">Catat Transaksi</h2>
      <form id="tx-form" onsubmit="addTransaction(event)" class="space-y-4">
        
        <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl">
          <button type="button" id="btn-type-out" onclick="setTxType('out')" class="py-2 text-xs font-bold rounded-lg bg-white text-slate-800 shadow-sm">Pengeluaran (-)</button>
          <button type="button" id="btn-type-in" onclick="setTxType('in')" class="py-2 text-xs font-bold rounded-lg text-slate-500">Pemasukan (+)</button>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Pilih Dompet</label>
            <select id="tx-wallet" onchange="autoSelectBank()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"></select>
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 mb-1">Bank (Sumber/Tujuan Uang)</label>
            <select id="tx-bank" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"></select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Nominal (Rp)</label>
            <input type="number" id="tx-amount" placeholder="25000" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Keterangan</label>
            <input type="text" id="tx-desc" placeholder="Makan siang" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
          </div>
        </div>

        <button type="submit" id="btn-submit-tx" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold py-3.5 rounded-xl transition shadow-md shadow-indigo-100">Simpan Transaksi</button>
      </form>
    </section>

    <section class="space-y-4">
      <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-1">Riwayat Per Dompet</h2>
      <div id="wallet-tx-sections" class="space-y-4"></div>
    </section>
  </main>

  <!-- Modal Kelola Bank -->
  <div id="modal-bank" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-5 max-w-sm w-full space-y-4 shadow-xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-slate-800">Kelola Bank</h3>
        <button onclick="toggleModalBank()" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>
      <form onsubmit="saveBank(event)" class="space-y-3 pt-2 border-t border-slate-100">
        <input type="hidden" id="bank-edit-id">
        <div><label class="block text-xs font-semibold text-slate-500 mb-1">Nama Bank</label><input type="text" id="bank-name" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm"></div>
        <div><label class="block text-xs font-semibold text-slate-500 mb-1">Saldo Saat Ini (Rp)</label><input type="number" id="bank-balance" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm"></div>
        <div class="flex gap-2"><button type="submit" class="flex-1 bg-indigo-600 text-white font-bold py-2.5 rounded-xl text-xs">Simpan</button><button type="button" onclick="resetBankForm()" class="bg-slate-100 text-slate-600 font-semibold px-3 rounded-xl text-xs">Batal</button></div>
      </form>
      <div class="space-y-2 pt-2 border-t border-slate-100" id="modal-bank-list"></div>
    </div>
  </div>

  <!-- Modal Kelola Dompet -->
  <div id="modal-wallet" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-5 max-w-sm w-full space-y-4 shadow-xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-slate-800">Kelola Dompet / Alokasi</h3>
        <button onclick="toggleModalWallet()" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>
      <form onsubmit="saveWallet(event)" class="space-y-3 pt-2 border-t border-slate-100">
        <input type="hidden" id="wallet-edit-id">
        <div><label class="block text-xs font-semibold text-slate-500 mb-1">Nama Dompet</label><input type="text" id="wallet-name" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm"></div>
        <div><label class="block text-xs font-semibold text-slate-500 mb-1">Tautkan Utama ke Bank Mana?</label><select id="wallet-bank-id" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm"></select></div>
        <div><label class="block text-xs font-semibold text-slate-500 mb-1">Target Saldo Alokasi (Rp)</label><input type="number" id="wallet-budget" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm"></div>
        <div><label class="block text-xs font-semibold text-slate-500 mb-1">Limit Mingguan (Rp)</label><input type="number" id="wallet-max-limit" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm"></div>
        <div><label class="block text-xs font-semibold text-slate-500 mb-1">Limit Bulanan (Rp)</label><input type="number" id="wallet-monthly-limit" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm"></div>
        <div class="flex gap-2"><button type="submit" class="flex-1 bg-indigo-600 text-white font-bold py-2.5 rounded-xl text-xs">Simpan</button><button type="button" onclick="resetWalletForm()" class="bg-slate-100 text-slate-600 font-semibold px-3 rounded-xl text-xs">Batal</button></div>
      </form>
      <div class="space-y-2 pt-2 border-t border-slate-100" id="modal-wallet-list"></div>
    </div>
  </div>

  <script>
    // Inisialisasi Data Lama JSON & LocalStorage (Auto Migrate)
    let banks = JSON.parse(localStorage.getItem('my_banks')) || [];
    let wallets = JSON.parse(localStorage.getItem('my_wallets')) || [];
    let transactions = JSON.parse(localStorage.getItem('my_tx')) || [];
    let currentTxType = 'out';
    const colors = ['bg-emerald-500', 'bg-blue-500', 'bg-amber-500', 'bg-purple-500', 'bg-rose-500', 'bg-cyan-500'];

    // PROSES MIGRASI DATA LAMA (Jika belum ada format Bank)
    if (wallets.length > 0 && banks.length === 0) {
      banks = [
        { id: 'b_bri', name: 'Bank BRI', balance: 6500000 },
        { id: 'b_mandiri', name: 'Bank Mandiri', balance: 350000 }
      ];
      wallets = wallets.map(w => ({ ...w, bankId: w.bankId || 'b_bri' }));
      transactions = transactions.map(tx => ({ ...tx, bankId: tx.bankId || 'b_bri' }));
      saveData();
    } else if (banks.length === 0 && wallets.length === 0) {
       // Data kosong dari awal, isi default
       banks = [
        { id: 'b_bri', name: 'Bank BRI', balance: 6500000 },
        { id: 'b_mandiri', name: 'Bank Mandiri', balance: 350000 }
      ];
    }

    function saveData() {
      localStorage.setItem('my_banks', JSON.stringify(banks));
      localStorage.setItem('my_wallets', JSON.stringify(wallets));
      localStorage.setItem('my_tx', JSON.stringify(transactions));
    }

    function formatRupiah(number) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number); }
    function isWithinCurrentWeek(d) { if(!d)return false; return (new Date() - new Date(d)) / (1000*60*60*24) <= 7; }
    function isWithinCurrentMonth(d) { if(!d)return false; const t=new Date(), tx=new Date(d); return tx.getMonth()===t.getMonth() && tx.getFullYear()===t.getFullYear(); }

    function setTxType(type) {
      currentTxType = type;
      const btnOut = document.getElementById('btn-type-out'), btnIn = document.getElementById('btn-type-in'), btnSubmit = document.getElementById('btn-submit-tx');
      if (type === 'out') {
        btnOut.className = "py-2 text-xs font-bold rounded-lg bg-white text-slate-800 shadow-sm";
        btnIn.className = "py-2 text-xs font-bold rounded-lg text-slate-500";
        btnSubmit.className = "w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md"; btnSubmit.innerText = "Simpan Pengeluaran";
      } else {
        btnIn.className = "py-2 text-xs font-bold rounded-lg bg-white text-emerald-600 shadow-sm";
        btnOut.className = "py-2 text-xs font-bold rounded-lg text-slate-500";
        btnSubmit.className = "w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-md"; btnSubmit.innerText = "Simpan Pemasukan";
      }
    }

    function render() {
      document.getElementById('total-saldo').innerText = formatRupiah(banks.reduce((acc, b) => acc + Number(b.balance), 0));
      
      const bankSummary = document.getElementById('bank-summary-list');
      bankSummary.innerHTML = banks.map(b => `<div class="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm"><span class="text-xs font-bold text-slate-500">${b.name}</span><span class="text-sm font-extrabold text-slate-800 mt-1 block">${formatRupiah(b.balance)}</span></div>`).join('');

      const walletStats = {};
      wallets.forEach(w => walletStats[w.id] = { spent: 0, weekly: 0, monthly: 0, income: 0 });
      transactions.forEach(tx => {
        if (walletStats[tx.walletId]) {
          const amt = Number(tx.amount);
          if (tx.type === 'in') walletStats[tx.walletId].income += amt;
          else {
            walletStats[tx.walletId].spent += amt;
            if (isWithinCurrentWeek(tx.fullDate)) walletStats[tx.walletId].weekly += amt;
            if (isWithinCurrentMonth(tx.fullDate)) walletStats[tx.walletId].monthly += amt;
          }
        }
      });

      document.getElementById('warning-container').innerHTML = '';
      document.getElementById('wallet-list').innerHTML = wallets.map(w => {
        const stat = walletStats[w.id];
        const pct = Math.round((stat.monthly / (Number(w.monthlyLimit) || 1)) * 100);
        return `<div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm space-y-3">
            <div class="flex justify-between">
              <div><span class="font-bold text-sm block">${w.name}</span><span class="text-[10px] bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-md">Utama: ${banks.find(b=>b.id===w.bankId)?.name||'-'}</span></div>
              <span class="text-[10px] font-semibold bg-slate-100 px-2 py-1 rounded-lg">Bulan Ini: ${pct}%</span>
            </div>
            <div class="flex justify-between items-end">
              <div><p class="text-[10px] text-slate-400">SISA ALOKASI</p><p class="text-base font-extrabold text-slate-800">${formatRupiah(Number(w.budget)+stat.income-stat.spent)}</p></div>
              <div class="text-right text-[10px] text-slate-500"><p>Keluar Bln: <span class="font-bold">${formatRupiah(stat.monthly)}</span></p></div>
            </div>
          </div>`;
      }).join('');

      document.getElementById('tx-wallet').innerHTML = wallets.map(w => `<option value="${w.id}">${w.name}</option>`).join('');
      document.getElementById('tx-bank').innerHTML = banks.map(b => `<option value="${b.id}">${b.name} (Sisa: ${formatRupiah(b.balance)})</option>`).join('');
      document.getElementById('wallet-bank-id').innerHTML = banks.map(b => `<option value="${b.id}">${b.name}</option>`).join('');

      document.getElementById('wallet-tx-sections').innerHTML = wallets.map(w => {
        const wTx = transactions.map((t, i) => ({...t, i})).filter(t => t.walletId === w.id);
        const txHtml = wTx.length ? wTx.slice().reverse().map(tx => `<div class="bg-white p-3 rounded-xl border border-slate-100 flex justify-between shadow-sm">
            <div><p class="font-bold text-xs">${tx.desc} <span class="text-[9px] bg-slate-100 text-slate-500 px-1 rounded">${banks.find(b=>b.id===tx.bankId)?.name||'-'}</span></p><p class="text-[10px] text-slate-400">${tx.date}</p></div>
            <div class="flex gap-2"><span class="font-bold text-xs ${tx.type==='in'?'text-emerald-600':'text-red-500'}">${tx.type==='in'?'+':'-'}${formatRupiah(tx.amount)}</span><button onclick="deleteTx(${tx.i})" class="text-red-500 text-xs px-1">✕</button></div>
          </div>`).join('') : '<div class="text-center py-4 text-xs text-slate-400">Belum ada transaksi</div>';
        return `<div class="bg-slate-100/70 p-4 rounded-2xl border border-slate-200/60 space-y-3"><div class="font-bold text-sm">${w.name}</div>${txHtml}</div>`;
      }).join('');
      renderModalList();
    }

    function autoSelectBank() {
      const w = wallets.find(w => w.id === document.getElementById('tx-wallet').value);
      if(w) document.getElementById('tx-bank').value = w.bankId;
    }

    function addTransaction(e) {
      e.preventDefault();
      const walletId = document.getElementById('tx-wallet').value;
      const bankId = document.getElementById('tx-bank').value;
      const amount = Number(document.getElementById('tx-amount').value);
      const bank = banks.find(b => b.id === bankId);
      
      if(currentTxType === 'out') bank.balance -= amount; else bank.balance += amount;
      transactions.push({ walletId, bankId, amount, desc: document.getElementById('tx-desc').value, type: currentTxType, date: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }), fullDate: new Date().toISOString() });
      saveData(); document.getElementById('tx-amount').value = ''; document.getElementById('tx-desc').value = ''; render();
    }

    function deleteTx(index) {
      if(confirm('Hapus & kembalikan saldo bank?')) {
        const tx = transactions[index];
        const bank = banks.find(b => b.id === tx.bankId);
        if(bank) { if(tx.type === 'out') bank.balance += Number(tx.amount); else bank.balance -= Number(tx.amount); }
        transactions.splice(index, 1); saveData(); render();
      }
    }

    // --- Modal Bank ---
    function toggleModalBank() { document.getElementById('modal-bank').classList.toggle('hidden'); document.getElementById('modal-bank').classList.toggle('flex'); }
    function saveBank(e) {
      e.preventDefault(); const id = document.getElementById('bank-edit-id').value;
      if (id) { const b = banks.find(b => b.id === id); b.name = document.getElementById('bank-name').value; b.balance = Number(document.getElementById('bank-balance').value); }
      else banks.push({ id: 'b_' + Date.now(), name: document.getElementById('bank-name').value, balance: Number(document.getElementById('bank-balance').value) });
      saveData(); resetBankForm(); render();
    }
    function resetBankForm() { document.getElementById('bank-edit-id').value = ''; document.getElementById('bank-name').value = ''; document.getElementById('bank-balance').value = ''; }
    function editBank(id) { const b = banks.find(b => b.id === id); document.getElementById('bank-edit-id').value = b.id; document.getElementById('bank-name').value = b.name; document.getElementById('bank-balance').value = b.balance; }
    function delBank(id) { if(wallets.some(w => w.bankId === id)) return alert('Ubah dompet terkait sebelum menghapus bank!'); if(banks.length <= 1) return alert('Minimal 1 bank!'); if(confirm('Hapus?')) { banks = banks.filter(b => b.id !== id); saveData(); render(); } }

    // --- Modal Dompet & Validasi Budget ---
    function toggleModalWallet() { document.getElementById('modal-wallet').classList.toggle('hidden'); document.getElementById('modal-wallet').classList.toggle('flex'); }
    function saveWallet(e) {
      e.preventDefault(); 
      const editId = document.getElementById('wallet-edit-id').value;
      const bankId = document.getElementById('wallet-bank-id').value;
      const budget = Number(document.getElementById('wallet-budget').value);
      const bank = banks.find(b => b.id === bankId);

      // Cek Validasi Saldo Utama dari Bank yang dipilih
      const allocs = wallets.reduce((sum, w) => (w.bankId === bankId && w.id !== editId) ? sum + Number(w.budget) : sum, 0);
      if (budget > (bank.balance - allocs)) return alert(`Gagal! Sisa saldo ${bank.name} tidak mencukupi.\nSisa bebas dialokasikan: ${formatRupiah(bank.balance - allocs)}`);

      if(editId) {
        const w = wallets.find(w => w.id === editId);
        w.name = document.getElementById('wallet-name').value; w.bankId = bankId; w.budget = budget;
        w.maxLimit = document.getElementById('wallet-max-limit').value; w.monthlyLimit = document.getElementById('wallet-monthly-limit').value;
      } else {
        wallets.push({ id: 'w_' + Date.now(), name: document.getElementById('wallet-name').value, bankId, budget, maxLimit: document.getElementById('wallet-max-limit').value, monthlyLimit: document.getElementById('wallet-monthly-limit').value });
      }
      saveData(); resetWalletForm(); render();
    }
    function resetWalletForm() { ['wallet-edit-id','wallet-name','wallet-budget','wallet-max-limit','wallet-monthly-limit'].forEach(i => document.getElementById(i).value = ''); }
    function editWallet(id) { const w = wallets.find(w => w.id === id); document.getElementById('wallet-edit-id').value = w.id; document.getElementById('wallet-name').value = w.name; document.getElementById('wallet-bank-id').value = w.bankId; document.getElementById('wallet-budget').value = w.budget; document.getElementById('wallet-max-limit').value = w.maxLimit; document.getElementById('wallet-monthly-limit').value = w.monthlyLimit; }
    function delWallet(id) { if(wallets.length <= 1) return alert('Minimal 1 dompet!'); if(confirm('Hapus?')) { wallets = wallets.filter(w => w.id !== id); saveData(); render(); } }

    function renderModalList() {
      document.getElementById('modal-bank-list').innerHTML = banks.map(b => `<div class="flex justify-between p-2.5 bg-slate-50 border rounded-xl"><div><p class="text-xs font-bold">${b.name}</p></div><div class="flex gap-2"><button onclick="editBank('${b.id}')" class="text-xs text-indigo-600">Edit</button><button onclick="delBank('${b.id}')" class="text-xs text-red-500">Hapus</button></div></div>`).join('');
      document.getElementById('modal-wallet-list').innerHTML = wallets.map(w => `<div class="flex justify-between p-2.5 bg-slate-50 border rounded-xl"><div><p class="text-xs font-bold">${w.name}</p></div><div class="flex gap-2"><button onclick="editWallet('${w.id}')" class="text-xs text-indigo-600">Edit</button><button onclick="delWallet('${w.id}')" class="text-xs text-red-500">Hapus</button></div></div>`).join('');
    }

    // --- Import / Export ---
    function exportData() {
      const a = document.createElement('a');
      a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ banks, wallets, transactions }));
      a.download = `backup_keuangan_${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a); a.click(); a.remove();
    }
    function importData(e) {
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const p = JSON.parse(evt.target.result);
          let ib = p.banks || [], iw = p.wallets || [], itx = p.transactions || [];
          // Auto migrate data lama saat di-import
          if(ib.length === 0) {
            ib = [ { id: 'b_bri', name: 'Bank BRI', balance: 6500000 }, { id: 'b_mandiri', name: 'Bank Mandiri', balance: 350000 } ];
            iw = iw.map(w => ({ ...w, bankId: w.bankId || 'b_bri' }));
            itx = itx.map(t => ({ ...t, bankId: t.bankId || 'b_bri' }));
          }
          banks = ib; wallets = iw; transactions = itx;
          saveData(); render(); alert('Restore & Migrasi Berhasil!');
        } catch(err) { alert('Format file tidak valid.'); }
      };
      reader.readAsText(file); e.target.value = '';
    }

    render();
    autoSelectBank();
  </script>
</body>
</html>
