<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dompet Ku - Multi Bank</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-indigo-600 text-white p-6 shadow-lg rounded-b-3xl max-w-md mx-auto">
    <div class="flex justify-between items-center mb-4">
      <div>
        <p class="text-xs text-indigo-200 uppercase tracking-wider font-semibold">Total Sisa Uang (Semua Bank)</p>
        <h1 id="total-saldo" class="text-3xl font-extrabold mt-1">Rp 0</h1>
      </div>
      <div class="flex gap-1.5 flex-wrap justify-end">
        <button onclick="toggleModalBank()" class="text-[11px] bg-indigo-500 hover:bg-indigo-400 text-white px-2.5 py-2 rounded-xl transition font-medium">
          🏦 Atur Bank
        </button>
        <button onclick="toggleModalWallet()" class="text-[11px] bg-indigo-500 hover:bg-indigo-400 text-white px-2.5 py-2 rounded-xl transition font-medium">
          👛 Atur Dompet
        </button>
        <button onclick="exportData()" title="Backup Data" class="text-[11px] bg-indigo-700 hover:bg-indigo-800 text-white px-2 py-2 rounded-xl transition">
          📤
        </button>
        <button onclick="document.getElementById('import-input').click()" title="Restore Data" class="text-[11px] bg-indigo-700 hover:bg-indigo-800 text-white px-2 py-2 rounded-xl transition">
          📥
        </button>
        <input type="file" id="import-input" accept=".json" class="hidden" onchange="importData(event)">
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-6 space-y-6">

    <!-- Area Peringatan (Alert Banner Mingguan & Bulanan) -->
    <div id="warning-container" class="space-y-2">
      <!-- Rendered by JS -->
    </div>

    <!-- Ringkasan Bank / Akun -->
    <section>
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider">Daftar Akun Bank / Sumber Dana</h2>
      </div>
      <div id="bank-summary-list" class="grid grid-cols-2 gap-3">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- Ringkasan Dompet -->
    <section>
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider">Alokasi Dompet</h2>
      </div>
      <div id="wallet-list" class="grid grid-cols-1 gap-3">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- Form Catat Transaksi -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
      <h2 class="text-base font-bold text-slate-700 mb-4">Catat Transaksi</h2>
      <form id="tx-form" onsubmit="addTransaction(event)" class="space-y-4">
        
        <!-- Tab Tipe Transaksi (Pengeluaran / Pemasukan) -->
        <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl">
          <button type="button" id="btn-type-out" onclick="setTxType('out')" class="py-2 text-xs font-bold rounded-lg bg-white text-slate-800 shadow-sm">
            Pengeluaran (-)
          </button>
          <button type="button" id="btn-type-in" onclick="setTxType('in')" class="py-2 text-xs font-bold rounded-lg text-slate-500">
            Pemasukan (+)
          </button>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Pilih Dompet (Sumber Bank Mengikuti)</label>
          <select id="tx-wallet" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
            <!-- Rendered by JS -->
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Nominal (Rp)</label>
            <input type="number" id="tx-amount" placeholder="25000" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Keterangan</label>
            <input type="text" id="tx-desc" placeholder="Makan siang / Bonus" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
          </div>
        </div>

        <button type="submit" id="btn-submit-tx" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold py-3.5 rounded-xl transition shadow-md shadow-indigo-100">
          Simpan Transaksi
        </button>
      </form>
    </section>

    <!-- Riwayat Transaksi Dipisah Per Dompet -->
    <section class="space-y-4">
      <div class="flex justify-between items-center mb-1">
        <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider">Riwayat Per Dompet</h2>
      </div>
      <div id="wallet-tx-sections" class="space-y-4">
        <!-- Rendered by JS -->
      </div>
    </section>

  </main>

  <!-- Modal Kelola Bank -->
  <div id="modal-bank" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-5 max-w-sm w-full space-y-4 shadow-xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-slate-800">Kelola Akun Bank</h3>
        <button onclick="toggleModalBank()" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>

      <!-- Form Tambah/Ubah Bank -->
      <form onsubmit="saveBank(event)" class="space-y-3 pt-2 border-t border-slate-100">
        <input type="hidden" id="bank-edit-id">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Nama Bank / Sumber Dana</label>
          <input type="text" id="bank-name" placeholder="Misal: BCA / Cash" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Saldo Awal (Rp)</label>
          <input type="number" id="bank-balance" placeholder="1500000" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="flex gap-2 pt-1">
          <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-xs">
            Simpan Bank
          </button>
          <button type="button" onclick="resetBankForm()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold px-3 rounded-xl text-xs">
            Batal
          </button>
        </div>
      </form>

      <!-- Daftar Bank Saat Ini -->
      <div class="space-y-2 pt-2 border-t border-slate-100" id="modal-bank-list">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <!-- Modal Kelola Dompet -->
  <div id="modal-wallet" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-5 max-w-sm w-full space-y-4 shadow-xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-slate-800">Kelola Dompet</h3>
        <button onclick="toggleModalWallet()" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>

      <!-- Form Tambah/Ubah Dompet -->
      <form onsubmit="saveWallet(event)" class="space-y-3 pt-2 border-t border-slate-100">
        <input type="hidden" id="wallet-edit-id">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Nama Dompet</label>
          <input type="text" id="wallet-name" placeholder="Misal: Holiday" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Ambil Saldo Dari Bank Mana?</label>
          <select id="wallet-bank-id" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
            <!-- Rendered by JS -->
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Target Alokasi Awal (Rp)</label>
          <input type="number" id="wallet-budget" placeholder="1000000" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Limit Pengeluaran Per Minggu (Rp)</label>
          <input type="number" id="wallet-max-limit" placeholder="500000" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Limit Pengeluaran Per Bulan (Rp)</label>
          <input type="number" id="wallet-monthly-limit" placeholder="2000000" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="flex gap-2 pt-1">
          <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-xs">
            Simpan Dompet
          </button>
          <button type="button" onclick="resetWalletForm()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold px-3 rounded-xl text-xs">
            Batal
          </button>
        </div>
      </form>

      <!-- Daftar Dompet Saat Ini -->
      <div class="space-y-2 pt-2 border-t border-slate-100" id="modal-wallet-list">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <script>
    // 1. Inisialisasi Data Default
    const defaultBanks = [
      { id: 'b_bca', name: 'BCA', initialBalance: 3000000, color: 'bg-blue-500' },
      { id: 'b_cash', name: 'Dompet Fisik / Cash', initialBalance: 1500000, color: 'bg-emerald-500' }
    ];

    const defaultWallets = [
      { id: 'holiday', name: 'Holiday', bankId: 'b_bca', budget: 2900000, maxLimit: 750000, monthlyLimit: 2500000, color: 'bg-emerald-500' },
      { id: 'personal', name: 'Keperluan Sendiri', bankId: 'b_bca', budget: 1600000, maxLimit: 400000, monthlyLimit: 1500000, color: 'bg-blue-500' },
      { id: 'emergency', name: 'Dana Darurat', bankId: 'b_cash', budget: 1500000, maxLimit: 200000, monthlyLimit: 800000, color: 'bg-amber-500' }
    ];

    const colors = ['bg-emerald-500', 'bg-blue-500', 'bg-amber-500', 'bg-purple-500', 'bg-rose-500', 'bg-cyan-500'];

    let banks = JSON.parse(localStorage.getItem('my_banks')) || defaultBanks;
    let wallets = JSON.parse(localStorage.getItem('my_wallets')) || defaultWallets;
    let transactions = JSON.parse(localStorage.getItem('my_tx')) || [];
    let currentTxType = 'out';

    function saveData() {
      localStorage.setItem('my_banks', JSON.stringify(banks));
      localStorage.setItem('my_wallets', JSON.stringify(wallets));
      localStorage.setItem('my_tx', JSON.stringify(transactions));
    }

    function formatRupiah(number) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
    }

    function isWithinCurrentWeek(dateString) {
      if (!dateString) return false;
      const txDate = new Date(dateString);
      const today = new Date();
      const diffTime = today - txDate;
      const diffDays = diffTime / (1000 * 60 * 60 * 24);
      return diffDays >= 0 && diffDays <= 7;
    }

    function isWithinCurrentMonth(dateString) {
      if (!dateString) return false;
      const txDate = new Date(dateString);
      const today = new Date();
      return txDate.getMonth() === today.getMonth() && txDate.getFullYear() === today.getFullYear();
    }

    function setTxType(type) {
      currentTxType = type;
      const btnOut = document.getElementById('btn-type-out');
      const btnIn = document.getElementById('btn-type-in');
      const btnSubmit = document.getElementById('btn-submit-tx');

      if (type === 'out') {
        btnOut.className = "py-2 text-xs font-bold rounded-lg bg-white text-slate-800 shadow-sm";
        btnIn.className = "py-2 text-xs font-bold rounded-lg text-slate-500";
        btnSubmit.className = "w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold py-3.5 rounded-xl transition shadow-md shadow-indigo-100";
        btnSubmit.innerText = "Simpan Pengeluaran";
      } else {
        btnIn.className = "py-2 text-xs font-bold rounded-lg bg-white text-emerald-600 shadow-sm";
        btnOut.className = "py-2 text-xs font-bold rounded-lg text-slate-500";
        btnSubmit.className = "w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold py-3.5 rounded-xl transition shadow-md shadow-emerald-100";
        btnSubmit.innerText = "Tambah Uang (Pemasukan)";
      }
    }

    // 2. Render Tampilan Utama
    function render() {
      // Hitung Saldo Tiap Bank
      const bankBalances = {};
      banks.forEach(b => {
        bankBalances[b.id] = Number(b.initialBalance) || 0;
      });

      const walletStats = {};
      wallets.forEach(w => walletStats[w.id] = { spent: 0, weeklySpent: 0, monthlySpent: 0, income: 0 });

      transactions.forEach(tx => {
        const wallet = wallets.find(w => w.id === tx.walletId);
        if (wallet) {
          const amount = Number(tx.amount);
          // Update Bank Balance
          if (bankBalances[wallet.bankId] !== undefined) {
            if (tx.type === 'in') {
              bankBalances[wallet.bankId] += amount;
              walletStats[tx.walletId].income += amount;
            } else {
              bankBalances[wallet.bankId] -= amount;
              walletStats[tx.walletId].spent += amount;

              if (isWithinCurrentWeek(tx.fullDate)) {
                walletStats[tx.walletId].weeklySpent += amount;
              }
              if (isWithinCurrentMonth(tx.fullDate)) {
                walletStats[tx.walletId].monthlySpent += amount;
              }
            }
          }
        }
      });

      // Hitung Total Sisa Saldo Semua Bank
      let totalNetBalance = 0;
      Object.values(bankBalances).forEach(bal => totalNetBalance += bal);
      document.getElementById('total-saldo').innerText = formatRupiah(totalNetBalance);

      // Render Bank Summary List
      const bankSummaryListEl = document.getElementById('bank-summary-list');
      bankSummaryListEl.innerHTML = '';
      banks.forEach(b => {
        const currentBal = bankBalances[b.id] !== undefined ? bankBalances[b.id] : Number(b.initialBalance);
        bankSummaryListEl.innerHTML += `
          <div class="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-between">
            <div class="flex items-center gap-2 mb-1">
              <span class="w-2.5 h-2.5 rounded-full ${b.color || 'bg-indigo-500'}"></span>
              <span class="font-bold text-slate-700 text-xs truncate">${b.name}</span>
            </div>
            <p class="text-sm font-extrabold text-slate-900 mt-1">${formatRupiah(currentBal)}</p>
          </div>
        `;
      });

      // Render Peringatan Mingguan & Bulanan
      const warningContainer = document.getElementById('warning-container');
      warningContainer.innerHTML = '';
      
      const walletListEl = document.getElementById('wallet-list');
      walletListEl.innerHTML = '';

      wallets.forEach(w => {
        const stats = walletStats[w.id] || { spent: 0, weeklySpent: 0, monthlySpent: 0, income: 0 };
        const remaining = Number(w.budget) + stats.income - stats.spent;
        const maxLimit = Number(w.maxLimit) || 1;
        const monthlyLimit = Number(w.monthlyLimit) || 1;
        const linkedBank = banks.find(b => b.id === w.bankId);
        
        const percentWeekly = Math.round((stats.weeklySpent / maxLimit) * 100);
        const percentMonthly = Math.round((stats.monthlySpent / monthlyLimit) * 100);

        if (percentWeekly >= 80) {
          const isOver = percentWeekly >= 100;
          warningContainer.innerHTML += `
            <div class="p-3 rounded-2xl border ${isOver ? 'bg-red-50 border-red-200 text-red-700' : 'bg-amber-50 border-amber-200 text-amber-800'} flex items-start gap-3 shadow-sm">
              <span class="text-base">${isOver ? '🚨' : '⚠️'}</span>
              <div class="text-xs">
                <span class="font-bold block mb-0.5">Limit Minggu Ini (${w.name}) Terlewati!</span>
                Mencapai <b>${percentWeekly}%</b> (${formatRupiah(stats.weeklySpent)} / ${formatRupiah(maxLimit)}).
              </div>
            </div>
          `;
        }

        if (percentMonthly >= 80) {
          const isOverMonthly = percentMonthly >= 100;
          warningContainer.innerHTML += `
            <div class="p-3 rounded-2xl border ${isOverMonthly ? 'bg-rose-50 border-rose-200 text-rose-700' : 'bg-orange-50 border-orange-200 text-orange-800'} flex items-start gap-3 shadow-sm">
              <span class="text-base">📅</span>
              <div class="text-xs">
                <span class="font-bold block mb-0.5">Limit Bulan Ini (${w.name}) Jebol!</span>
                Mencapai <b>${percentMonthly}%</b> (${formatRupiah(stats.monthlySpent)} / ${formatRupiah(monthlyLimit)}).
              </div>
            </div>
          `;
        }

        walletListEl.innerHTML += `
          <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-between space-y-3">
            <div class="flex justify-between items-center">
              <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full ${w.color || 'bg-indigo-500'}"></span>
                <div>
                  <span class="font-bold text-slate-700 text-sm block">${w.name}</span>
                  <span class="text-[10px] text-indigo-600 font-semibold bg-indigo-50 px-2 py-0.5 rounded-md">Bank: ${linkedBank ? linkedBank.name : 'Tidak Diketahui'}</span>
                </div>
              </div>
              <span class="text-[10px] font-semibold bg-slate-100 px-2 py-1 rounded-lg text-slate-600">
                Bulan Ini: ${percentMonthly}%
              </span>
            </div>
            
            <div class="flex justify-between items-end">
              <div>
                <p class="text-[10px] text-slate-400 uppercase tracking-wide">Sisa Alokasi Dompet</p>
                <p class="text-base font-extrabold text-slate-800">${formatRupiah(remaining)}</p>
              </div>
              <div class="text-right text-[10px] text-slate-500 space-y-0.5">
                <p>Keluar Mgg: <span class="font-bold text-slate-700">${formatRupiah(stats.weeklySpent)}</span></p>
                <p>Keluar Bln: <span class="font-bold text-slate-700">${formatRupiah(stats.monthlySpent)}</span></p>
              </div>
            </div>
            
            <div class="space-y-1">
              <div class="flex justify-between text-[10px] text-slate-400 font-medium">
                <span>Progress Bulanan</span>
                <span>Limit: ${formatRupiah(monthlyLimit)}</span>
              </div>
              <div class="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
                <div class="${percentMonthly >= 100 ? 'bg-rose-500' : percentMonthly >= 80 ? 'bg-amber-500' : (w.color || 'bg-indigo-500')} h-1.5 rounded-full transition-all duration-300" style="width: ${Math.min(percentMonthly, 100)}%"></div>
              </div>
            </div>
          </div>
        `;
      });

      // Render Select Option Form Transaksi
      const selectEl = document.getElementById('tx-wallet');
      selectEl.innerHTML = wallets.map(w => {
        const b = banks.find(item => item.id === w.bankId);
        return `<option value="${w.id}">${w.name} (${b ? b.name : 'Bank'})</option>`;
      }).join('');

      // Render Select Option di Form Dompet (Pilih Bank)
      const selectBankWalletEl = document.getElementById('wallet-bank-id');
      selectBankWalletEl.innerHTML = banks.map(b => `<option value="${b.id}">${b.name}</option>`).join('');

      // Render Riwayat Transaksi Dipisah Per Dompet
      const walletTxSectionsEl = document.getElementById('wallet-tx-sections');
      walletTxSectionsEl.innerHTML = '';

      wallets.forEach(w => {
        const walletTxs = transactions.map((tx, idx) => ({ ...tx, realIndex: idx }))
                                      .filter(tx => tx.walletId === w.id);
        
        const totalWalletSpent = walletTxs.reduce((sum, tx) => tx.type === 'out' ? sum + Number(tx.amount) : sum, 0);
        const linkedBank = banks.find(b => b.id === w.bankId);

        let txItemsHtml = '';
        if (walletTxs.length === 0) {
          txItemsHtml = `<div class="text-center py-4 text-slate-400 text-xs italic bg-white rounded-xl border border-slate-100">Belum ada transaksi di dompet ini.</div>`;
        } else {
          txItemsHtml = walletTxs.slice().reverse().map(tx => {
            const isIncome = tx.type === 'in';
            return `
              <div class="bg-white p-3 rounded-xl border border-slate-100 flex justify-between items-center shadow-sm">
                <div class="flex items-center gap-2.5">
                  <div class="w-2 h-6 rounded-full ${w.color || 'bg-slate-300'}"></div>
                  <div>
                    <p class="font-bold text-slate-700 text-xs">${tx.desc}</p>
                    <p class="text-[10px] text-slate-400">${tx.date}</p>
                  </div>
                </div>
                <div class="flex items-center gap-2">
                  <span class="font-bold text-xs ${isIncome ? 'text-emerald-600' : 'text-red-500'}">
                    ${isIncome ? '+' : '-'} ${formatRupiah(tx.amount)}
                  </span>
                  <button onclick="deleteTransaction(${tx.realIndex})" class="text-slate-300 hover:text-red-500 text-xs font-bold p-1">✕</button>
                </div>
              </div>
            `;
          }).join('');
        }

        walletTxSectionsEl.innerHTML += `
          <div class="bg-slate-100/70 p-4 rounded-2xl border border-slate-200/60 space-y-3">
            <div class="flex justify-between items-center pb-2 border-b border-slate-200/60">
              <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full ${w.color || 'bg-indigo-500'}"></span>
                <div>
                  <span class="font-bold text-slate-800 text-sm block">${w.name}</span>
                  <span class="text-[10px] text-slate-500">Sumber: <b class="text-slate-700">${linkedBank ? linkedBank.name : '-'}</b></span>
                </div>
              </div>
              <div class="text-right">
                <span class="text-[10px] text-slate-400 block uppercase font-semibold">Total Pengeluaran</span>
                <span class="text-xs font-extrabold text-red-500">${formatRupiah(totalWalletSpent)}</span>
              </div>
            </div>
            <div class="space-y-2">
              ${txItemsHtml}
            </div>
          </div>
        `;
      });

      renderModalBankList();
      renderModalWalletList();
    }

    // 3. Tambah / Simpan Transaksi
    function addTransaction(e) {
      e.preventDefault();
      const walletId = document.getElementById('tx-wallet').value;
      const amount = Number(document.getElementById('tx-amount').value);
      const desc = document.getElementById('tx-desc').value;

      if (!walletId) {
        alert('Pilih dompet terlebih dahulu!');
        return;
      }

      const now = new Date();
      const newTx = {
        walletId,
        amount,
        desc,
        type: currentTxType,
        date: now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }),
        fullDate: now.toISOString()
      };

      transactions.push(newTx);
      saveData();

      document.getElementById('tx-amount').value = '';
      document.getElementById('tx-desc').value = '';

      render();
    }

    // 4. Hapus Transaksi
    function deleteTransaction(index) {
      if (confirm('Hapus pencatatan transaksi ini?')) {
        transactions.splice(index, 1);
        saveData();
        render();
      }
    }

    // 5. Kelola Bank
    function toggleModalBank() {
      const modal = document.getElementById('modal-bank');
      modal.classList.toggle('hidden');
      modal.classList.toggle('flex');
    }

    function saveBank(e) {
      e.preventDefault();
      const editId = document.getElementById('bank-edit-id').value;
      const name = document.getElementById('bank-name').value;
      const initialBalance = Number(document.getElementById('bank-balance').value);

      if (editId) {
        const bank = banks.find(b => b.id === editId);
        if (bank) {
          bank.name = name;
          bank.initialBalance = initialBalance;
        }
      } else {
        const newBank = {
          id: 'b_' + Date.now(),
          name,
          initialBalance,
          color: colors[banks.length % colors.length]
        };
        banks.push(newBank);
      }

      saveData();
      resetBankForm();
      render();
    }

    function editBank(id) {
      const bank = banks.find(b => b.id === id);
      if (bank) {
        document.getElementById('bank-edit-id').value = bank.id;
        document.getElementById('bank-name').value = bank.name;
        document.getElementById('bank-balance').value = bank.initialBalance;
      }
    }

    function deleteBank(id) {
      const usedByWallet = wallets.some(w => w.bankId === id);
      if (usedByWallet) {
        alert('Bank ini sedang digunakan oleh dompet! Ubah atau hapus dompet yang menggunakan bank ini terlebih dahulu.');
        return;
      }
      if (banks.length <= 1) {
        alert('Setidaknya harus ada 1 akun bank!');
        return;
      }
      if (confirm('Hapus akun bank ini?')) {
        banks = banks.filter(b => b.id !== id);
        saveData();
        render();
      }
    }

    function resetBankForm() {
      document.getElementById('bank-edit-id').value = '';
      document.getElementById('bank-name').value = '';
      document.getElementById('bank-balance').value = '';
    }

    function renderModalBankList() {
      const modalList = document.getElementById('modal-bank-list');
      modalList.innerHTML = banks.map(b => `
        <div class="flex justify-between items-center p-2 rounded-xl bg-slate-50 border border-slate-100">
          <div>
            <p class="font-bold text-xs text-slate-700">${b.name}</p>
            <p class="text-[10px] text-slate-400">Saldo Awal: ${formatRupiah(b.initialBalance)}</p>
          </div>
          <div class="flex gap-2">
            <button type="button" onclick="editBank('${b.id}')" class="text-xs text-indigo-600 font-semibold hover:underline">Edit</button>
            <button type="button" onclick="deleteBank('${b.id}')" class="text-xs text-red-500 font-semibold hover:underline">Hapus</button>
          </div>
        </div>
      `).join('');
    }

    // 6. Kelola Dompet
    function toggleModalWallet() {
      const modal = document.getElementById('modal-wallet');
      modal.classList.toggle('hidden');
      modal.classList.toggle('flex');
    }

    function saveWallet(e) {
      e.preventDefault();
      const editId = document.getElementById('wallet-edit-id').value;
      const name = document.getElementById('wallet-name').value;
      const bankId = document.getElementById('wallet-bank-id').value;
      const budget = Number(document.getElementById('wallet-budget').value);
      const maxLimit = Number(document.getElementById('wallet-max-limit').value);
      const monthlyLimit = Number(document.getElementById('wallet-monthly-limit').value);

      if (editId) {
        const wallet = wallets.find(w => w.id === editId);
        if (wallet) {
          wallet.name = name;
          wallet.bankId = bankId;
          wallet.budget = budget;
          wallet.maxLimit = maxLimit;
          wallet.monthlyLimit = monthlyLimit;
        }
      } else {
        const newWallet = {
          id: 'w_' + Date.now(),
          name,
          bankId,
          budget,
          maxLimit,
          monthlyLimit,
          color: colors[wallets.length % colors.length]
        };
        wallets.push(newWallet);
      }

      saveData();
      resetWalletForm();
      render();
    }

    function editWallet(id) {
      const wallet = wallets.find(w => w.id === id);
      if (wallet) {
        document.getElementById('wallet-edit-id').value = wallet.id;
        document.getElementById('wallet-name').value = wallet.name;
        document.getElementById('wallet-bank-id').value = wallet.bankId;
        document.getElementById('wallet-budget').value = wallet.budget;
        document.getElementById('wallet-max-limit').value = wallet.maxLimit;
        document.getElementById('wallet-monthly-limit').value = wallet.monthlyLimit || 2000000;
      }
    }

    function deleteWallet(id) {
      if (wallets.length <= 1) {
        alert('Setidaknya harus ada 1 dompet!');
        return;
      }
      if (confirm('Hapus dompet ini?')) {
        wallets = wallets.filter(w => w.id !== id);
        saveData();
        render();
      }
    }

    function resetWalletForm() {
      document.getElementById('wallet-edit-id').value = '';
      document.getElementById('wallet-name').value = '';
      document.getElementById('wallet-budget').value = '';
      document.getElementById('wallet-max-limit').value = '';
      document.getElementById('wallet-monthly-limit').value = '';
    }

    function renderModalWalletList() {
      const modalList = document.getElementById('modal-wallet-list');
      modalList.innerHTML = wallets.map(w => {
        const b = banks.find(item => item.id === w.bankId);
        return `
          <div class="flex justify-between items-center p-2 rounded-xl bg-slate-50 border border-slate-100">
            <div>
              <p class="font-bold text-xs text-slate-700">${w.name} <span class="font-normal text-indigo-600">(${b ? b.name : '-'})</span></p>
              <p class="text-[10px] text-slate-400">Limit: Mgg (${formatRupiah(w.maxLimit)}) | Bln (${formatRupiah(w.monthlyLimit || 0)})</p>
            </div>
            <div class="flex gap-2">
              <button type="button" onclick="editWallet('${w.id}')" class="text-xs text-indigo-600 font-semibold hover:underline">Edit</button>
              <button type="button" onclick="deleteWallet('${w.id}')" class="text-xs text-red-500 font-semibold hover:underline">Hapus</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // 7. Fitur Backup & Restore (Import/Export JSON)
    function exportData() {
      const backupData = { banks, wallets, transactions };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `backup_keuangan_multibank_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed.banks && parsed.wallets && parsed.transactions) {
            banks = parsed.banks;
            wallets = parsed.wallets;
            transactions = parsed.transactions;
            saveData();
            render();
            alert('Data berhasil dipulihkan (Restore)!');
          } else {
            alert('Format file cadangan tidak valid.');
          }
        } catch (err) {
          alert('Gagal membaca file JSON.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    render();
  </script>
</body>
</html>
