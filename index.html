<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dompet Ku</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- Chart.js CDN untuk Analytics Grafik -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-indigo-600 text-white p-6 shadow-lg rounded-b-3xl max-w-md mx-auto">
    <div class="flex justify-between items-center mb-4">
      <div>
        <p class="text-xs text-indigo-200 uppercase tracking-wider font-semibold">Total Sisa Uang</p>
        <h1 id="total-saldo" class="text-3xl font-extrabold mt-1">Rp 0</h1>
      </div>
      <div class="flex gap-2">
        <button onclick="ui.toggleModalWallet()" class="text-xs bg-indigo-500 hover:bg-indigo-400 text-white px-3 py-2 rounded-xl transition font-medium">
          Atur Dompet
        </button>
        <button onclick="app.exportData()" title="Backup Data" class="text-xs bg-indigo-700 hover:bg-indigo-800 text-white px-2.5 py-2 rounded-xl transition font-medium">
          📤 Backup
        </button>
        <button onclick="document.getElementById('import-input').click()" title="Restore Data" class="text-xs bg-indigo-700 hover:bg-indigo-800 text-white px-2.5 py-2 rounded-xl transition font-medium">
          📥 Restore
        </button>
        <input type="file" id="import-input" accept=".json" class="hidden" onchange="app.importData(event)">
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-6 space-y-6">

    <!-- Area Peringatan (Alert Banner Mingguan & Bulanan) -->
    <div id="warning-container" class="space-y-2"></div>

    <!-- Ringkasan Dompet -->
    <section>
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider">Dompet Saya</h2>
      </div>
      <div id="wallet-list" class="grid grid-cols-1 gap-3"></div>
    </section>

    <!-- Section Analisis Bulanan & Chart -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-base font-bold text-slate-700">Analisis Bulanan</h2>
        
        <!-- Filter Bar Bulan & Tahun -->
        <div class="flex gap-2">
          <select id="filter-month" onchange="app.onFilterChange()" class="bg-slate-50 border border-slate-200 rounded-lg p-1.5 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-700">
            <!-- Rendered by JS -->
          </select>
          <select id="filter-year" onchange="app.onFilterChange()" class="bg-slate-50 border border-slate-200 rounded-lg p-1.5 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-700">
            <!-- Rendered by JS -->
          </select>
        </div>
      </div>
      
      <!-- Ringkasan Bulanan (Income, Expense, Net) -->
      <div class="grid grid-cols-3 gap-2 mb-5 text-center">
        <div class="bg-slate-50 p-2 rounded-xl border border-slate-100">
          <p class="text-[10px] text-slate-400 font-semibold uppercase">Pemasukan</p>
          <p id="summary-income" class="text-xs font-bold text-emerald-600">Rp 0</p>
        </div>
        <div class="bg-slate-50 p-2 rounded-xl border border-slate-100">
          <p class="text-[10px] text-slate-400 font-semibold uppercase">Pengeluaran</p>
          <p id="summary-expense" class="text-xs font-bold text-rose-600">Rp 0</p>
        </div>
        <div class="bg-slate-50 p-2 rounded-xl border border-slate-100">
          <p class="text-[10px] text-slate-400 font-semibold uppercase">Net Balance</p>
          <p id="summary-net" class="text-xs font-bold text-indigo-600">Rp 0</p>
        </div>
      </div>

      <!-- Area Chart.js -->
      <div class="space-y-6">
        <div>
          <h3 class="text-xs font-semibold text-slate-500 mb-2 text-center">Tren Arus Kas (Harian)</h3>
          <canvas id="trendChart" height="200"></canvas>
        </div>
        <div>
          <h3 class="text-xs font-semibold text-slate-500 mb-2 text-center">Distribusi Pengeluaran Dompet</h3>
          <canvas id="doughnutChart" height="200"></canvas>
        </div>
      </div>
    </section>

    <!-- Form Catat Transaksi -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
      <h2 class="text-base font-bold text-slate-700 mb-4">Catat Transaksi</h2>
      <form id="tx-form" onsubmit="app.addTransaction(event)" class="space-y-4">
        
        <!-- Tab Tipe Transaksi -->
        <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl">
          <button type="button" id="btn-type-out" onclick="ui.setTxType('out')" class="py-2 text-xs font-bold rounded-lg bg-white text-slate-800 shadow-sm">
            Pengeluaran (-)
          </button>
          <button type="button" id="btn-type-in" onclick="ui.setTxType('in')" class="py-2 text-xs font-bold rounded-lg text-slate-500">
            Pemasukan (+)
          </button>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Pilih Dompet</label>
          <select id="tx-wallet" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
            <!-- Rendered by JS -->
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Nominal (Rp)</label>
            <input type="number" id="tx-amount" placeholder="25000" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Keterangan</label>
            <input type="text" id="tx-desc" placeholder="Makan siang / Bonus" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
          </div>
        </div>

        <button type="submit" id="btn-submit-tx" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold py-3.5 rounded-xl transition shadow-md shadow-indigo-100">
          Simpan Pengeluaran
        </button>
      </form>
    </section>

    <!-- Riwayat Transaksi Bulanan -->
    <section class="space-y-4">
      <div class="flex justify-between items-center mb-1">
        <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider">Riwayat Transaksi (Bulan Ini)</h2>
      </div>
      <div id="monthly-tx-list" class="space-y-3">
        <!-- Rendered by JS -->
      </div>
    </section>

  </main>

  <!-- Modal Kelola Dompet -->
  <div id="modal-wallet" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-5 max-w-sm w-full space-y-4 shadow-xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-slate-800">Kelola Dompet</h3>
        <button onclick="ui.toggleModalWallet()" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>

      <!-- Form Tambah/Ubah Dompet -->
      <form onsubmit="app.saveWallet(event)" class="space-y-3 pt-2 border-t border-slate-100">
        <input type="hidden" id="wallet-edit-id">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Nama Dompet</label>
          <input type="text" id="wallet-name" placeholder="Misal: Tabungan" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Target Saldo Awal (Rp)</label>
          <input type="number" id="wallet-budget" placeholder="1000000" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Batas Maksimal Pengeluaran Per Minggu (Rp)</label>
          <input type="number" id="wallet-max-limit" placeholder="500000" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Batas Maksimal Pengeluaran Per Bulan (Rp)</label>
          <input type="number" id="wallet-monthly-limit" placeholder="2000000" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="flex gap-2 pt-1">
          <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-xs">
            Simpan Dompet
          </button>
          <button type="button" onclick="ui.resetWalletForm()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold px-3 rounded-xl text-xs">
            Batal
          </button>
        </div>
      </form>

      <!-- Daftar Dompet Saat Ini -->
      <div class="space-y-2 pt-2 border-t border-slate-100" id="modal-wallet-list">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <!-- Scripts: Module Injection -->
  <script src="js/utils.js"></script> 
  <script src="js/state.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
