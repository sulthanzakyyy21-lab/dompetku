<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manajemen Keuangan & Dompet</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-20 font-sans select-none">

    <!-- Header / Navbar -->
    <header class="bg-indigo-600 text-white p-4 sticky top-0 z-40 shadow-md flex justify-between items-center">
        <div>
            <h1 class="text-lg font-bold flex items-center gap-2">
                <i class="fa-solid fa-wallet"></i> Keuanganku
            </h1>
            <p class="text-xs text-indigo-200">Kelola Dompet & Limitt Bulanan</p>
        </div>
        <div class="text-right">
            <p class="text-[10px] text-indigo-200">Total Saldo</p>
            <p id="header-total-saldo" class="text-sm font-bold text-white">Rp 0</p>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="p-4 max-w-lg mx-auto space-y-4">

        <!-- CONTAINER BANNER PERINGATAN (DYNAMIC) -->
        <div id="warning-alerts-container" class="space-y-2"></div>

        <!-- TAB 1: DASHBOARD DOMPET -->
        <section id="tab-dompet" class="tab-content active space-y-4">
            <!-- Form Tambah/Edit Dompet -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                <h3 class="font-bold text-sm text-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-folder-plus text-indigo-600"></i> <span id="wallet-form-title">Tambah Dompet Baru</span>
                </h3>
                <input type="hidden" id="wallet-id">
                <div>
                    <label class="text-xs font-semibold text-slate-500">Nama Dompet</label>
                    <input type="text" id="wallet-name" placeholder="misal: Keperluan Sendiri, Holiday, Dana Darurat" class="w-full p-2 mt-1 bg-slate-50 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs font-semibold text-slate-500">Saldo Awal (Rp)</label>
                        <input type="number" id="wallet-balance" placeholder="0" class="w-full p-2 mt-1 bg-slate-50 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-500">Limit Bulanan (Rp)</label>
                        <input type="number" id="wallet-limit" placeholder="0 (Isi jika ada limit)" class="w-full p-2 mt-1 bg-slate-50 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="saveWallet()" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700">Simpan Dompet</button>
                    <button onclick="resetWalletForm()" class="bg-slate-200 text-slate-700 px-3 py-2 rounded-lg text-sm font-semibold">Batal</button>
                </div>
            </div>

            <!-- Daftar Dompet -->
            <div class="space-y-3">
                <h3 class="font-bold text-sm text-slate-700">Daftar Dompet & Batas Pengeluaran</h3>
                <div id="wallets-list" class="space-y-3">
                    <!-- Dynamic List Dompet -->
                </div>
            </div>
        </section>

        <!-- TAB 2: TRANSAKSI (CATAT PENGELUARAN/PEMASUKAN) -->
        <section id="tab-transaksi" class="tab-content space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                <h3 class="font-bold text-sm text-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-indigo-600"></i> Catat Transaksi Baru
                </h3>
                <div>
                    <label class="text-xs font-semibold text-slate-500">Jenis Transaksi</label>
                    <select id="tx-type" class="w-full p-2 mt-1 bg-slate-50 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="expense">Pengeluaran (-)</option>
                        <option value="income">Pemasukan (+)</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-500">Pilih Dompet</label>
                    <select id="tx-wallet" class="w-full p-2 mt-1 bg-slate-50 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <!-- Dynamic Options Dompet -->
                    </select>
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-500">Jumlah Uang (Rp)</label>
                    <input type="number" id="tx-amount" placeholder="0" class="w-full p-2 mt-1 bg-slate-50 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-500">Keterangan / Catatan</label>
                    <input type="text" id="tx-note" placeholder="misal: Makan siang, Bensin, Tiket" class="w-full p-2 mt-1 bg-slate-50 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <button onclick="saveTransaction()" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg text-sm font-bold hover:bg-indigo-700">Simpan Transaksi</button>
            </div>

            <!-- Riwayat Transaksi -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-3 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                    <span class="font-bold text-sm text-slate-700"><i class="fa-solid fa-clock-rotate-left"></i> Riwayat Transaksi</span>
                    <button onclick="clearAllTransactions()" class="text-xs text-red-500 font-medium hover:underline">Hapus Semua</button>
                </div>
                <div id="tx-list" class="divide-y divide-slate-100 max-h-80 overflow-y-auto">
                    <!-- Dynamic List Transaksi -->
                </div>
            </div>
        </section>

        <!-- TAB 3: PENGATURAN & BACKUP DATA -->
        <section id="tab-pengaturan" class="tab-content space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                <h3 class="font-bold text-sm text-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-database text-indigo-600"></i> Backup & Restore Data
                </h3>
                <p class="text-xs text-slate-500">Simpan cadangan data keuangan kamu ke bentuk file JSON atau pulihkan data lama.</p>
                <div class="flex gap-2">
                    <button onclick="exportData()" class="flex-1 bg-emerald-600 text-white py-2 rounded-lg text-xs font-semibold flex justify-center items-center gap-1 hover:bg-emerald-700">
                        <i class="fa-solid fa-download"></i> Backup (JSON)
                    </button>
                    <label class="flex-1 bg-amber-600 text-white py-2 rounded-lg text-xs font-semibold flex justify-center items-center gap-1 cursor-pointer hover:bg-amber-700">
                        <i class="fa-solid fa-upload"></i> Restore Data
                        <input type="file" id="import-file" accept=".json" onchange="importData(event)" class="hidden">
                    </label>
                </div>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation Bar (Mobile) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around py-2 z-40">
        <button onclick="switchTab('dompet')" id="nav-dompet" class="flex flex-col items-center text-indigo-600 font-semibold text-xs">
            <i class="fa-solid fa-wallet text-lg mb-0.5"></i> Dompet
        </button>
        <button onclick="switchTab('transaksi')" id="nav-transaksi" class="flex flex-col items-center text-slate-400 hover:text-indigo-600 text-xs">
            <i class="fa-solid fa-receipt text-lg mb-0.5"></i> Transaksi
        </button>
        <button onclick="switchTab('pengaturan')" id="nav-pengaturan" class="flex flex-col items-center text-slate-400 hover:text-indigo-600 text-xs">
            <i class="fa-solid fa-sliders text-lg mb-0.5"></i> Pengaturan
        </button>
    </nav>

    <script>
        let db;

        window.onload = () => initDB();

        function initDB() {
            const request = indexedDB.open("FinanceTrackerDB", 1);
            request.onupgradeneeded = function(e) {
                db = e.target.result;
                if (!db.objectStoreNames.contains("wallets")) {
                    db.createObjectStore("wallets", { keyPath: "id", autoIncrement: true });
                }
                if (!db.objectStoreNames.contains("transactions")) {
                    db.createObjectStore("transactions", { keyPath: "id", autoIncrement: true });
                }
            };
            request.onsuccess = function(e) {
                db = e.target.result;
                renderWallets();
                renderTransactions();
            };
            request.onerror = function(e) {
                console.error("Gagal membuka database", e);
            };
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');

            document.querySelectorAll('nav button').forEach(el => {
                el.classList.remove('text-indigo-600', 'font-semibold');
                el.classList.add('text-slate-400');
            });
            const activeNav = document.getElementById(`nav-${tabName}`);
            activeNav.classList.remove('text-slate-400');
            activeNav.classList.add('text-indigo-600', 'font-semibold');

            if (tabName === 'dompet') renderWallets();
            if (tabName === 'transaksi') {
                populateWalletOptions();
                renderTransactions();
            }
        }

        // --- MANAJEMEN DOMPET ---
        function saveWallet() {
            const id = document.getElementById('wallet-id').value;
            const name = document.getElementById('wallet-name').value.trim();
            const balance = parseFloat(document.getElementById('wallet-balance').value) || 0;
            const limit = parseFloat(document.getElementById('wallet-limit').value) || 0;

            if (!name) {
                alert("Mohon isi nama dompet!");
                return;
            }

            const tx = db.transaction("wallets", "readwrite");
            const store = tx.objectStore("wallets");

            const walletData = { name, initialBalance: balance, currentBalance: balance, limit };
            if (id) {
                walletData.id = parseInt(id);
                // Menjaga balance yang sudah dihitung jika mengedit
                store.get(parseInt(id)).onsuccess = (e) => {
                    const existing = e.target.result;
                    walletData.currentBalance = existing.currentBalance;
                    store.put(walletData).onsuccess = () => finishSaveWallet();
                };
            } else {
                store.add(walletData).onsuccess = () => finishSaveWallet();
            }
        }

        function finishSaveWallet() {
            alert("Dompet berhasil disimpan!");
            resetWalletForm();
            renderWallets();
        }

        function resetWalletForm() {
            document.getElementById('wallet-id').value = '';
            document.getElementById('wallet-name').value = '';
            document.getElementById('wallet-balance').value = '';
            document.getElementById('wallet-limit').value = '';
            document.getElementById('wallet-form-title').innerText = 'Tambah Dompet Baru';
        }

        function editWallet(id) {
            const tx = db.transaction("wallets", "readonly");
            tx.objectStore("wallets").get(id).onsuccess = (e) => {
                const w = e.target.result;
                document.getElementById('wallet-id').value = w.id;
                document.getElementById('wallet-name').value = w.name;
                document.getElementById('wallet-balance').value = w.initialBalance;
                document.getElementById('wallet-limit').value = w.limit || 0;
                document.getElementById('wallet-form-title').innerText = 'Edit Dompet';
            };
        }

        function deleteWallet(id) {
            if (confirm("Hapus dompet ini? Transaksi terkait dompet ini mungkin perlu disesuaikan.")) {
                const tx = db.transaction("wallets", "readwrite");
                tx.objectStore("wallets").delete(id).onsuccess = () => renderWallets();
            }
        }

        function renderWallets() {
            const txW = db.transaction("wallets", "readonly");
            txW.objectStore("wallets").getAll().onsuccess = (e) => {
                const wallets = e.target.result;
                
                const txT = db.transaction("transactions", "readonly");
                txT.objectStore("transactions").getAll().onsuccess = (ev) => {
                    const transactions = ev.target.result;

                    let grandTotal = 0;
                    let warningList = [];
                    const walletsContainer = document.getElementById('wallets-list');

                    if (wallets.length === 0) {
                        walletsContainer.innerHTML = `<div class="p-4 bg-white rounded-xl text-center text-xs text-slate-400">Belum ada dompet. Tambahkan dompet pertama kamu di atas.</div>`;
                        document.getElementById('header-total-saldo').innerText = 'Rp 0';
                        document.getElementById('warning-alerts-container').innerHTML = '';
                        return;
                    }

                    walletsContainer.innerHTML = wallets.map(w => {
                        // Kalkulasi Total Pengeluaran & Saldo Sekarang
                        const walletTx = transactions.filter(t => t.walletId === w.id);
                        const totalExpense = walletTx.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);
                        const totalIncome = walletTx.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
                        
                        const currentBalance = w.initialBalance + totalIncome - totalExpense;
                        grandTotal += currentBalance;

                        // Kalkulasi Persentase Limit
                        let limitHTML = '';
                        let warningStatus = null;

                        if (w.limit && w.limit > 0) {
                            const percent = Math.min(Math.round((totalExpense / w.limit) * 100), 100);
                            let colorClass = "bg-emerald-500";
                            let badgeText = "Aman";
                            let badgeClass = "bg-emerald-100 text-emerald-700";

                            if (percent >= 90) {
                                colorClass = "bg-red-500";
                                badgeText = "Bahaya / Hampir Habis!";
                                badgeClass = "bg-red-100 text-red-700 font-bold animate-pulse";
                                warningStatus = { wallet: w.name, percent, type: 'danger', expense: totalExpense, limit: w.limit };
                            } else if (percent >= 75) {
                                colorClass = "bg-amber-500";
                                badgeText = "Peringatan!";
                                badgeClass = "bg-amber-100 text-amber-700 font-bold";
                                warningStatus = { wallet: w.name, percent, type: 'warning', expense: totalExpense, limit: w.limit };
                            }

                            if (warningStatus) warningList.push(warningStatus);

                            limitHTML = `
                                <div class="mt-3 pt-2 border-t border-slate-100">
                                    <div class="flex justify-between items-center text-xs mb-1">
                                        <span class="text-slate-500 font-medium">Pengeluaran: <b class="text-slate-700">Rp ${totalExpense.toLocaleString('id-ID')}</b> / Rp ${w.limit.toLocaleString('id-ID')}</span>
                                        <span class="px-2 py-0.5 rounded-full text-[10px] ${badgeClass}">${percent}% (${badgeText})</span>
                                    </div>
                                    <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                                        <div class="${colorClass} h-2 rounded-full transition-all duration-300" style="width: ${percent}%"></div>
                                    </div>
                                </div>
                            `;
                        }

                        return `
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h4 class="font-bold text-base text-slate-800">${w.name}</h4>
                                        <p class="text-xs text-slate-400">Saldo: <span class="text-indigo-600 font-bold text-sm">Rp ${currentBalance.toLocaleString('id-ID')}</span></p>
                                    </div>
                                    <div class="flex gap-1">
                                        <button onclick="editWallet(${w.id})" class="p-1.5 text-indigo-600 hover:bg-indigo-50 rounded text-xs"><i class="fa-solid fa-pen"></i></button>
                                        <button onclick="deleteWallet(${w.id})" class="p-1.5 text-red-500 hover:bg-red-50 rounded text-xs"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>
                                ${limitHTML}
                            </div>
                        `;
                    }).join('');

                    document.getElementById('header-total-saldo').innerText = `Rp ${grandTotal.toLocaleString('id-ID')}`;
                    renderWarningBanners(warningList);
                };
            };
        }

        function renderWarningBanners(warnings) {
            const container = document.getElementById('warning-alerts-container');
            if (warnings.length === 0) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = warnings.map(w => `
                <div class="${w.type === 'danger' ? 'bg-red-50 border-red-200 text-red-800' : 'bg-amber-50 border-amber-200 text-amber-800'} border p-3 rounded-xl text-xs flex items-center gap-3 shadow-sm">
                    <i class="fa-solid ${w.type === 'danger' ? 'fa-triangle-exclamation text-red-600' : 'fa-circle-exclamation text-amber-600'} text-lg"></i>
                    <div class="flex-1">
                        <p class="font-bold">Peringatan Limit: ${w.wallet}</p>
                        <p class="text-[11px] opacity-90">Pengeluaran sudah mencapai <b>${w.percent}%</b> (Rp ${w.expense.toLocaleString('id-ID')} / Rp ${w.limit.toLocaleString('id-ID')}).</p>
                    </div>
                </div>
            `).join('');
        }

        // --- MANAJEMEN TRANSAKSI ---
        function populateWalletOptions() {
            const tx = db.transaction("wallets", "readonly");
            tx.objectStore("wallets").getAll().onsuccess = (e) => {
                const wallets = e.target.result;
                const select = document.getElementById('tx-wallet');
                select.innerHTML = wallets.map(w => `<option value="${w.id}">${w.name}</option>`).join('');
            };
        }

        function saveTransaction() {
            const type = document.getElementById('tx-type').value;
            const walletId = parseInt(document.getElementById('tx-wallet').value);
            const amount = parseFloat(document.getElementById('tx-amount').value) || 0;
            const note = document.getElementById('tx-note').value.trim();

            if (!walletId || amount <= 0) {
                alert("Pilih dompet dan masukkan nominal uang yang valid!");
                return;
            }

            const tx = db.transaction(["wallets", "transactions"], "readwrite");
            const walletStore = tx.objectStore("wallets");
            const txStore = tx.objectStore("transactions");

            const transactionData = {
                type,
                walletId,
                amount,
                note: note || (type === 'expense' ? 'Pengeluaran' : 'Pemasukan'),
                date: new Date().toISOString()
            };

            txStore.add(transactionData).onsuccess = () => {
                // Pengecekan Notifikasi Warning Pasca Transaksi
                if (type === 'expense') {
                    checkPostTransactionWarning(walletId);
                } else {
                    alert("Transaksi berhasil dicatat!");
                }

                document.getElementById('tx-amount').value = '';
                document.getElementById('tx-note').value = '';
                renderTransactions();
                renderWallets();
            };
        }

        function checkPostTransactionWarning(walletId) {
            const txW = db.transaction("wallets", "readonly");
            txW.objectStore("wallets").get(walletId).onsuccess = (e) => {
                const wallet = e.target.result;
                if (wallet && wallet.limit > 0) {
                    const txT = db.transaction("transactions", "readonly");
                    txT.objectStore("transactions").getAll().onsuccess = (ev) => {
                        const allTx = ev.target.result;
                        const totalExpense = allTx.filter(t => t.walletId === walletId && t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);
                        const percent = Math.round((totalExpense / wallet.limit) * 100);

                        if (percent >= 100) {
                            alert(`⚠️ BAHAYA! Pengeluaran pada dompet "${wallet.name}" telah MELEBIHI LIMIT BULANAN! (${percent}%)\nTotal Pengeluaran: Rp ${totalExpense.toLocaleString('id-ID')} / Limit: Rp ${wallet.limit.toLocaleString('id-ID')}`);
                        } else if (percent >= 75) {
                            alert(`⚠️ PERINGATAN! Pengeluaran pada dompet "${wallet.name}" sudah mencapai ${percent}% dari limit bulanan.\nSisa limit: Rp ${(wallet.limit - totalExpense).toLocaleString('id-ID')}`);
                        } else {
                            alert("Transaksi berhasil dicatat!");
                        }
                    };
                } else {
                    alert("Transaksi berhasil dicatat!");
                }
            };
        }

        function renderTransactions() {
            const txT = db.transaction("transactions", "readonly");
            txT.objectStore("transactions").getAll().onsuccess = (e) => {
                const transactions = e.target.result.reverse();
                
                const txW = db.transaction("wallets", "readonly");
                txW.objectStore("wallets").getAll().onsuccess = (ev) => {
                    const wallets = ev.target.result;
                    const walletMap = {};
                    wallets.forEach(w => walletMap[w.id] = w.name);

                    const listContainer = document.getElementById('tx-list');
                    if (transactions.length === 0) {
                        listContainer.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">Belum ada riwayat transaksi</div>`;
                        return;
                    }

                    listContainer.innerHTML = transactions.map(t => {
                        const dateFormatted = new Date(t.date).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
                        const isExpense = t.type === 'expense';
                        return `
                            <div class="p-3 flex justify-between items-center text-xs">
                                <div>
                                    <p class="font-bold text-slate-800">${t.note}</p>
                                    <p class="text-[10px] text-slate-400">${dateFormatted} • Dompet: <span class="font-semibold text-slate-600">${walletMap[t.walletId] || 'Tidak Diketahui'}</span></p>
                                </div>
                                <span class="${isExpense ? 'text-red-500' : 'text-emerald-600'} font-bold">
                                    ${isExpense ? '-' : '+'}Rp ${t.amount.toLocaleString('id-ID')}
                                </span>
                            </div>
                        `;
                    }).join('');
                };
            };
        }

        function clearAllTransactions() {
            if (confirm("Hapus seluruh riwayat transaksi? Catatan pengeluaran akan di-reset.")) {
                const tx = db.transaction("transactions", "readwrite");
                tx.objectStore("transactions").clear().onsuccess = () => {
                    renderTransactions();
                    renderWallets();
                };
            }
        }

        // --- BACKUP & RESTORE ---
        function exportData() {
            const txW = db.transaction("wallets", "readonly");
            txW.objectStore("wallets").getAll().onsuccess = (e) => {
                const wallets = e.target.result;
                const txT = db.transaction("transactions", "readonly");
                txT.objectStore("transactions").getAll().onsuccess = (ev) => {
                    const transactions = ev.target.result;
                    const backupData = { wallets, transactions };

                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData));
                    const dlAnchorElem = document.createElement('a');
                    dlAnchorElem.setAttribute("href", dataStr);
                    dlAnchorElem.setAttribute("download", `keuangan_backup_${new Date().toISOString().slice(0,10)}.json`);
                    dlAnchorElem.click();
                };
            };
        }

        function importData(event) {
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.wallets && data.transactions) {
                        const tx = db.transaction(["wallets", "transactions"], "readwrite");
                        const walletStore = tx.objectStore("wallets");
                        const txStore = tx.objectStore("transactions");

                        data.wallets.forEach(w => { delete w.id; walletStore.add(w); });
                        data.transactions.forEach(t => { delete t.id; txStore.add(t); });

                        tx.oncomplete = () => {
                            alert("Data keuangan berhasil dipulihkan!");
                            renderWallets();
                            renderTransactions();
                        };
                    } else {
                        alert("Format file JSON tidak sesuai!");
                    }
                } catch (err) {
                    alert("Gagal membaca file backup!");
                }
            };
            fileReader.readAsText(event.target.files[0]);
        }
    </script>
</body>
</html>
